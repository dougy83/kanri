name: 'Create Release'

on:
  push:
    branches:
      - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-kanri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: |
          yarn cache clean
          yarn config delete proxy
          yarn config delete https-proxy
          yarn config delete registry
          yarn install --network-timeout 1000000 --frozen-lockfile

      - name: Build frontend
        run: yarn generate

      - name: Build Tauri app
        run: yarn tauri build

      - name: Get app version
        id: version
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          echo "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $tag = "app-v$ver"
          $name = "Kanri v$ver"

          # Collect artifacts
          $msi = Get-ChildItem src-tauri\target\release\bundle\msi\*.msi -Recurse | Select-Object -First 1
          $setup = Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe -Recurse | Select-Object -First 1
          $artifacts = @()
          if ($msi) { $artifacts += $msi.FullName }
          if ($setup) { $artifacts += $setup.FullName }

          # Create release with artifacts
          gh release create $tag $artifacts `
            --title $name `
            --notes "See the assets to download this version and install." `
            --target ${{ github.sha }} `
            --latest
